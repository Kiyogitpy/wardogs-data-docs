title: Wardogs Data Reference
description: Per-category reference docs for Wardogs game data
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-redirect-from

color_scheme: wardogs
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Full-text search over every page, split into sections at h2/h3
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  # also split on _ and . so "PlayerKill" finds DT_Reward_Cash_PlayerKill
  tokenizer_separator: /[\s\-/_.]+/
  rel_url: true
  button: true
  focus_shortcut_key: "k"

# "Ask the docs": URL of the answer Worker (see worker/ask/README.md). Leave empty to show the
# best-matching sections without a written answer.
ask_endpoint: ""

aux_links:
  "View on GitHub": "https://github.com/Kiyogitpy/wardogs-data-docs"

# The source JSON is browsed on GitHub (the docs link there), not served by Pages
exclude:
  - data/
  # Project, method and tooling docs live on GitHub only; the site is game data
  - docs/
  - sdk/
  - tools/
  - _tools/
  - mappings/
  - graphify-out/
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - LICENSE
  - Note_Template.md
  - aes.md
  - worker/
