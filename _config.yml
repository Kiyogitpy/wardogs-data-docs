title: Wardogs Wiki
description: Wardogs wiki articles, with the full game-data reference behind them
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-redirect-from

color_scheme: wardogs
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Full-text search over every page, split into sections at h2/h3
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  # also split on _ and . so "PlayerKill" finds DT_Reward_Cash_PlayerKill
  tokenizer_separator: /[\s\-/_.]+/
  rel_url: true
  button: true
  focus_shortcut_key: "k"

# "Ask the docs": URL of the answer Worker (see worker/ask/README.md). Leave empty to show the
# best-matching sections without a written answer.
ask_endpoint: "https://wardogs-ask.wardogs-docs.workers.dev"

aux_links:
  "View on GitHub": "https://github.com/Kiyogitpy/wardogs-data-docs"

# The raw source JSON is local only (gitignored); the docs cite it by path
exclude:
  - data/
  # Project, method and tooling docs live on GitHub only; the site is game data
  - docs/
  - sdk/
  - tools/
  - _tools/
  - mappings/
  - graphify-out/
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - LICENSE
  - Note_Template.md
  - aes.md
  - worker/

# The wiki: readable articles compiled from the data pages, served under /wiki/ with its
# own sidebar section. Writing rules: docs/WIKI_STYLE.md
collections:
  wiki:
    output: true
    permalink: /wiki/:path/
just_the_docs:
  collections:
    wiki:
      name: Wardogs Wiki
relative_links:
  enabled: true
  collections: true
defaults:
  - scope: { path: "", type: pages }
    values: { layout: reference }
  - scope: { path: "", type: wiki }
    values: { layout: wiki }
