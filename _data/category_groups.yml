    pages: [Ammo (feature), Ammo Packing, Explosives Reference, "Fire, Smoke and Mines", Artillery Shell Flight Data, UnderbarrelGrenadeLauncher (feature)]
  - name: Attachments and customisation
    pages: [Attachments and Platforms, Sights and Optics, Gunsmith (feature), Weapon Shop and Parts]
  - name: Asset and field reference
    pages: [Ranged Weapon Item Fields, Weapon Animation Sets and Misc]
"Game Modes & Maps":
