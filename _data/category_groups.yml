# Card groups on a data category page (rendered by _includes/category-cards.html). Keyed by
# category title; each group lists page titles. Kept here, not in page front matter, because
# several of these pages have generated front matter. Pages not listed go in a final "Other" row.
"Weapons & Ammo":
