    pages: [Experience Configs, Experiences (feature), ControlZone (feature), ControlZoneRegions (feature), Deathmatch (feature), Spotting (feature), TeamkillTracking (feature)]
  - name: PvE and training
    pages: [PvE (feature), PvE and Settings Assets, AI (feature), ShootingRange (feature), ShootingRangeTutorial (feature)]
  - name: Maps and world
    pages: [Maps, Vehicle Spawns, WorldFeatures (feature), FlyByManager (feature), FactoryInvestment (feature), FactoryInvestment 01 (feature)]
"Vehicles":
