# Wiki main page portal boxes (rendered by _includes/wiki-front-portals.html). icon = a Material
# Symbols Sharp name; url = site path, passed through relative_url. `more` is the footer link to
# the box's hub, where every article of the area is listed. Boxes hold up to six tiles (a 3x2
# block) so rows line up; `wide: true` spans two grid columns (Weapons: ten tiles in a 5x2 block).
- title: Weapons
  wide: true
  more: { label: All weapons, url: /wiki/weapons/ }
  tiles:
    - { label: Assault rifles, icon: target, url: /wiki/weapons/#assault-rifles }
    - { label: Marksman rifles, icon: my_location, url: /wiki/weapons/#marksman-rifles }
    - { label: Light machine guns, icon: bolt, url: /wiki/weapons/#light-machine-guns }
    - { label: Submachine guns, icon: speed, url: /wiki/weapons/#submachine-guns }
    - { label: Pistols, icon: ads_click, url: /wiki/weapons/#pistols }
    - { label: Shotguns, icon: scatter_plot, url: /wiki/weapons/#shotguns }
    - { label: Sniper rifles, icon: gps_fixed, url: /wiki/weapons/#sniper-rifles }
    - { label: Launchers, icon: rocket_launch, url: /wiki/weapons/#launchers }
    - { label: Ammunition, icon: inventory_2, url: /wiki/ammunition/ }
    - { label: Attachments, icon: build, url: /wiki/attachments/ }
