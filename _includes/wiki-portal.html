{%- comment -%}Main page portal boxes from _data/wiki_portals.yml.{%- endcomment -%}
<div class="wiki-portals" markdown="0">
{%- for box in site.data.wiki_portals %}
<section class="wiki-portal" aria-labelledby="portal-{{ forloop.index }}">
  <h2 class="wiki-band" id="portal-{{ forloop.index }}">{{ box.title }}</h2>
  <ul class="wiki-tiles">
  {%- for t in box.tiles %}
    <li><a class="wiki-tile" href="{{ t.url | relative_url }}"><span class="wiki-icon" aria-hidden="true">{{ t.icon }}</span><span>{{ t.label }}</span></a></li>
  {%- endfor %}
  </ul>
</section>
{%- endfor %}
</div>
