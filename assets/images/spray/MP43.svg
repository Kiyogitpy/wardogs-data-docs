<svg xmlns="http://www.w3.org/2000/svg" width="640" height="372" viewBox="0 0 640 372" role="img" aria-labelledby="t d">
<title id="t">MP43 spray pattern</title>
<desc id="d">Cumulative pitch and yaw of each shot in the spray pattern. Season 2 only; no Season 1 data.</desc>
<style>
.bg{fill:#ffffff;stroke:#8a8a8a;stroke-width:1}
.plot{fill:none;stroke:#8a8a8a;stroke-width:1}
.grid{stroke:#e2e2e2;stroke-width:1}
.axis{stroke:#444;stroke-width:1.2}
.ref{stroke:#9a9a9a;stroke-width:1;stroke-dasharray:2 3}
.tick{font:11px sans-serif;fill:#333}
.lbl{font:12px sans-serif;fill:#333}
.ttl{font:600 15px sans-serif;fill:#111}
.num1{font:10px sans-serif;fill:#2b6cb0}
.num2{font:10px sans-serif;fill:#2f855a}
.note{font:13px sans-serif;fill:#555}
.mk1{stroke:#2b6cb0;fill:#2b6cb0}
.mk2{stroke:#2f855a;fill:#2f855a}
.ln1{fill:none;stroke:#2b6cb0;stroke-width:2;stroke-dasharray:7 4}
.ln2{fill:none;stroke:#2f855a;stroke-width:2}
.band1{fill:#2b6cb0;fill-opacity:.18;stroke:none}
.band2{fill:#2f855a;fill-opacity:.18;stroke:none}
@media (prefers-color-scheme: dark){
.bg{fill:#1c1f24;stroke:#6b7280}
.plot{stroke:#6b7280}
.grid{stroke:#333842}
.axis{stroke:#c9ced6}
.ref{stroke:#7b8190}
.tick,.lbl{fill:#d7dbe2}
.ttl{fill:#f1f3f6}
.note{fill:#aab1bd}
.num1{fill:#63a6e6}
.num2{fill:#68c48f}
.mk1{stroke:#63a6e6;fill:#63a6e6}
.mk2{stroke:#68c48f;fill:#68c48f}
.ln1{stroke:#63a6e6}
.ln2{stroke:#68c48f}
.band1{fill:#63a6e6;fill-opacity:.22}
.band2{fill:#68c48f;fill-opacity:.22}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="639" height="371" rx="6"/>
<text class="ttl" x="70" y="26">MP43</text>
<line class="ln2" x1="70" y1="46" x2="96" y2="46"/>
<rect class="mk2" x="80" y="43" width="6" height="6"/>
<text class="lbl" x="104" y="50">Season 2</text>
<line class="grid" x1="107.93" y1="64" x2="107.93" y2="330"/>
<text class="tick" x="107.93" y="345" text-anchor="middle">0</text>
<line class="grid" x1="199.82" y1="64" x2="199.82" y2="330"/>
<text class="tick" x="199.82" y="345" text-anchor="middle">0.25</text>
<line class="grid" x1="291.71" y1="64" x2="291.71" y2="330"/>
<text class="tick" x="291.71" y="345" text-anchor="middle">0.5</text>
<line class="grid" x1="383.59" y1="64" x2="383.59" y2="330"/>
<text class="tick" x="383.59" y="345" text-anchor="middle">0.75</text>
<line class="grid" x1="475.48" y1="64" x2="475.48" y2="330"/>
<text class="tick" x="475.48" y="345" text-anchor="middle">1</text>
<line class="grid" x1="567.37" y1="64" x2="567.37" y2="330"/>
<text class="tick" x="567.37" y="345" text-anchor="middle">1.25</text>
<line class="grid" x1="70" y1="311.66" x2="620" y2="311.66"/>
<text class="tick" x="62" y="315.66" text-anchor="end">0</text>
<line class="grid" x1="70" y1="248.66" x2="620" y2="248.66"/>
<text class="tick" x="62" y="252.66" text-anchor="end">1</text>
<line class="grid" x1="70" y1="185.66" x2="620" y2="185.66"/>
<text class="tick" x="62" y="189.66" text-anchor="end">2</text>
<line class="grid" x1="70" y1="122.66" x2="620" y2="122.66"/>
<text class="tick" x="62" y="126.66" text-anchor="end">3</text>
<rect class="plot" x="70" y="64" width="550" height="266"/>
<line class="ref" x1="107.93" y1="64" x2="107.93" y2="330"/>
<line class="ref" x1="70" y1="311.66" x2="620" y2="311.66"/>
<text class="lbl" x="345.0" y="364" text-anchor="middle">Yaw (degrees, right +)</text>
<text class="lbl" transform="translate(18 197.0) rotate(-90)" text-anchor="middle">Pitch (degrees, up +)</text>
<polygon class="band2" points="416.67,203.93 582.07,82.34 582.07,82.34 416.67,203.93"/>
<polyline class="ln2" points="416.67,203.93 582.07,82.34"/>
<rect class="mk2" x="413.67" y="200.93" width="6" height="6"/>
<text class="num2" x="421.67" y="215.93">1</text>
<rect class="mk2" x="579.07" y="79.34" width="6" height="6"/>
<text class="num2" x="587.07" y="94.34">2</text>
</svg>
