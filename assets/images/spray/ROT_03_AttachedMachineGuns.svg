<svg xmlns="http://www.w3.org/2000/svg" width="640" height="372" viewBox="0 0 640 372" role="img" aria-labelledby="t d">
<title id="t">Unnamed (DA_ROT_03_AttachedMachineGuns_Stats) spray pattern</title>
