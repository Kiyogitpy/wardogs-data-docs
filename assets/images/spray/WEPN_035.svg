<text class="lbl" transform="translate(18 197.0) rotate(-90)" text-anchor="middle">Pitch (degrees, up +)</text>
<text class="note" x="345.0" y="197.0" text-anchor="middle">No recoil pattern in the exported data</text>
</svg>
