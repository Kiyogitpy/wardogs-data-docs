<line class="grid" x1="70" y1="265.79" x2="620" y2="265.79"/>
<text class="tick" x="62" y="269.79" text-anchor="end">0.2</text>
<line class="grid" x1="70" y1="219.93" x2="620" y2="219.93"/>
