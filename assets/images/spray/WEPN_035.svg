<line class="grid" x1="70" y1="174.07" x2="620" y2="174.07"/>
<text class="tick" x="62" y="178.07" text-anchor="end">0.6</text>
<line class="grid" x1="70" y1="128.21" x2="620" y2="128.21"/>
